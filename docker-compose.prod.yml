# Production stack for reelshub.pro
# Usage:
#   cp .env.prod.example .env.prod
#   # edit secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - directus_pg:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      POSTGRES_DB: ${DB_DATABASE:-directus}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  directus:
    image: directus/directus:11.3.5
    restart: unless-stopped
    volumes:
      - ./directus/uploads:/directus/uploads
      - ./directus/extensions:/directus/extensions
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET:?set DIRECTUS_SECRET in .env.prod}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env.prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.prod}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-https://cms.reelshub.pro}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://reelshub.pro,https://www.reelshub.pro}
      WEBSOCKETS_ENABLED: "true"
      # S3 (Timeweb). If STORAGE_LOCATIONS is unset, Directus keeps using local ./uploads.
      STORAGE_LOCATIONS: ${STORAGE_LOCATIONS:-local}
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      STORAGE_S3_DRIVER: s3
      STORAGE_S3_KEY: ${STORAGE_S3_KEY:-}
      STORAGE_S3_SECRET: ${STORAGE_S3_SECRET:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-ru-1}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
    networks:
      - internal
      - edge
    # no host ports — only via Caddy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-https://cms.reelshub.pro}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://reelshub.pro}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-https://cms.reelshub.pro}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://reelshub.pro}
      # Server-side: talk to Directus on Docker network
      DIRECTUS_URL: ${DIRECTUS_INTERNAL_URL:-http://directus:8055}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      - directus
    networks:
      - edge
    # no host ports — only via Caddy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # Bind only to the app public IP so Mailcow keeps 80/443 on the MX IP.
    # Example: BIND_IP=72.56.127.16
    ports:
      - "${BIND_IP:?set BIND_IP in .env.prod}:80:80"
      - "${BIND_IP:?set BIND_IP in .env.prod}:443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@reelshub.pro}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - directus
    networks:
      - edge

volumes:
  directus_pg:
  caddy_data:
  caddy_config:

networks:
  edge:
  internal:
